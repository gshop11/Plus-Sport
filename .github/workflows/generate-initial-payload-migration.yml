name: Generate initial Payload migration

on:
  push:
    branches:
      - stabilize/next16-payload385
    paths:
      - .github/workflows/generate-initial-payload-migration.yml

permissions:
  contents: read

jobs:
  generate-initial-migration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: plussport_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d plussport_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/plussport_migration?sslmode=disable
      PAYLOAD_SECRET: local-ci-migration-secret-not-used-outside-runner-123456789
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_DB_PUSH: "false"
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate initial Payload migration
        run: npm run payload -- migrate:create initial-staging-schema --skip-empty

      - name: Typecheck
        run: npm run typecheck

      - name: Verify migration artifact
        run: |
          test -d src/migrations
          test -n "$(find src/migrations -maxdepth 1 -type f)"

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: initial-staging-payload-migration
          path: src/migrations
          if-no-files-found: error
